name: Aegis CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # =========================================================
  # Backend
  # =========================================================
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      JWT_SECRET_KEY: ci-test-jwt-secret-not-for-production
      GEMINI_API_KEY: ci-test-gemini-key
      LANGGRAPH_STRICT_MSGPACK: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run backend tests
        run: |
          python -m pytest \
            --deselect=tests/test_semantic_retriever.py::test_payment_incident_retrieves_payment_runbook

  # =========================================================
  # Frontend
  # =========================================================
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  # =========================================================
  # Docker
  # =========================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    needs:
      - backend-tests
      - frontend-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker build \
            -t aegis-backend:ci \
            .

      - name: Build frontend Docker image
        run: |
          docker build \
            -t aegis-frontend:ci \
            --build-arg VITE_API_BASE_URL=/api \
            --build-arg VITE_APP_ENV=Production \
            ./frontend

  # =========================================================
  # Deployment Gate
  # =========================================================
  deployment-ready:
    name: Deployment Ready
    runs-on: ubuntu-latest
    timeout-minutes: 5

    needs:
      - backend-tests
      - frontend-build
      - docker-build

    steps:
      - name: Confirm deployment readiness
        run: |
          echo "All Aegis CI quality gates passed."
          echo "Backend tests: PASSED"
          echo "Frontend build: PASSED"
          echo "Docker builds: PASSED"
          echo "Aegis is ready for deployment."