services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: aegis-backend:latest
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      AEGIS_CHECKPOINT_PATH: /app/checkpoints/aegis_checkpoints.sqlite
    ports:
      - "8000:8000"
    volumes:
      - aegis_checkpoints:/app/checkpoints
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_APP_ENV: Production
    image: aegis-frontend:latest
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  aegis_checkpoints: